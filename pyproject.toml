[project]
name = "local-market-lab"
version = "1.0.0"
description = "Local-first portfolio analytics, backtesting, and scenario simulation — without investment signals."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Erik Gieske" }]
dependencies = [
    "typer>=0.12",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "python-dateutil>=2.9",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx2>=0.27"]
analytics = ["numpy>=1.26", "pandas>=2.2"]
export = ["reportlab>=4.0", "openpyxl>=3.1"]
marketdata = ["yfinance>=0.2.36"]

[project.scripts]
lml = "apps.cli.main:app"

[tool.setuptools.packages.find]
include = ["packages*", "apps*"]

[tool.setuptools.package-data]
"apps.web" = ["*.html", "*.ico", "static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
