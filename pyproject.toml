[project]
name = "local-market-lab"
version = "0.1.0"
description = "Local-first portfolio analytics, backtesting, and scenario simulation — without investment signals."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Erik Gieske" }]
dependencies = [
    "typer>=0.12",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
analytics = ["numpy>=1.26", "pandas>=2.2"]

[project.scripts]
lml = "apps.cli.main:app"

[tool.setuptools.packages.find]
include = ["packages*", "apps*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
