name: Windows Build

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release:
        description: 'Create GitHub Release'
        required: false
        default: 'false'

env:
  PYTHON_VERSION: '3.11'
  APP_VERSION: '0.8.0'

jobs:
  # -----------------------------------------------------------------
  # Job 1: Lint + Tests (from existing CI)
  # -----------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest tests/ -v --tb=short

  # -----------------------------------------------------------------
  # Job 2: Windows EXE + Installer Build
  # -----------------------------------------------------------------
  build-windows:
    needs: test
    runs-on: windows-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -e "."

      - name: Install UPX
        run: |
          choco install upx -y
        shell: powershell

      - name: Install Inno Setup
        run: |
          choco install innosetup -y
        shell: powershell

      - name: Verify tools
        run: |
          python --version
          pyinstaller --version
          upx --version
          iscc /? | Select-Object -First 1
        shell: powershell

      - name: Build EXE + Installer
        run: |
          cd windows
          .\build.bat --clean
        shell: cmd

      - name: Check EXE size
        run: |
          $exe = "windows\src\dist\LocalMarketLab.exe"
          $size = (Get-Item $exe).Length
          $sizeMB = [math]::Round($size / 1MB, 2)
          Write-Host "EXE size: ${sizeMB} MB"
          if ($sizeMB -gt 30) {
            Write-Error "EXE size ${sizeMB}MB exceeds 30MB limit!"
            exit 1
          }
        shell: powershell

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: LocalMarketLab-Windows-EXE
          path: windows/src/dist/LocalMarketLab.exe
          retention-days: 30

      - name: Upload Installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: LocalMarketLab-Windows-Installer
          path: windows/installer/output/LocalMarketLab-Setup-v${{ env.APP_VERSION }}.exe
          retention-days: 30

      - name: VirusTotal Scan (optional)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: maxladines/virus-total-action@v1
        with:
          vt_api_key: ${{ secrets.VIRUSTOTAL_API_KEY }}
          file: windows/src/dist/LocalMarketLab.exe
        continue-on-error: true

  # -----------------------------------------------------------------
  # Job 3: Create GitHub Release (on tag push)
  # -----------------------------------------------------------------
  release:
    needs: build-windows
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Download installer
        uses: actions/download-artifact@v4
        with:
          name: LocalMarketLab-Windows-Installer
          path: ./release

      - name: Download EXE
        uses: actions/download-artifact@v4
        with:
          name: LocalMarketLab-Windows-EXE
          path: ./release

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          files: |
            ./release/*.exe
          body: |
            ## Local Market Lab v${{ env.PYTHON_VERSION }}
            
            ### Windows Installation
            1. Download `LocalMarketLab-Setup-v${{ env.APP_VERSION }}.exe`
            2. Run the installer
            3. Launch from Start Menu or Desktop shortcut
            
            ### Portable Version
            - `LocalMarketLab.exe` — standalone, no installation required
            
            See [README.md](https://github.com/${{ github.repository }}/blob/main/README.md) for full documentation.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
